name: CI

on:
  push:
    branches: [main, extraphase]
  pull_request:
    branches: [main, extraphase]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go (backend + admin-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            apps/backend/go.sum
            apps/admin-backend/go.sum
      - name: backend build + test
        working-directory: apps/backend
        run: |
          go build ./...
          go test ./...
      - name: admin-backend build + test
        working-directory: apps/admin-backend
        run: |
          go build ./...
          go test ./...

  web-typecheck-and-build:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/web
        run: pnpm tsc --noEmit -p .
      - name: build
        working-directory: apps/web
        run: pnpm build

  web-e2e:
    name: Web (Playwright e2e)
    runs-on: ubuntu-latest
    needs: web-typecheck-and-build
    # Run a real backend + Postgres so authed flows + the realtime WS spec
    # actually execute (instead of skipping). Without this the suite only
    # exercises unauth UI paths — onboarding regressions, ws regressions, and
    # match-flow regressions all sail through CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livong
          POSTGRES_PASSWORD: livong
          POSTGRES_DB: livong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://livong:livong@localhost:5432/livong?sslmode=disable
      JWT_SECRET: ci-test-secret-not-for-prod
      LIVONG_DEV_LOGIN: "1"
      PORT: "6980"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install web deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: build backend
        working-directory: apps/backend
        run: go build -o /tmp/livong-backend .
      # Start backend in background, wait until it's actually serving
      # (curl exits 0 on any HTTP response — 401/404 are fine, we just want
      # to know the listener is up). Migrations run on startup so the schema
      # is in place before we seed.
      - name: start backend
        working-directory: apps/backend
        run: |
          /tmp/livong-backend > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if curl -s -o /dev/null --max-time 2 http://localhost:6980/; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never came up — last 50 log lines:" >&2
          tail -50 /tmp/backend.log >&2
          exit 1
      - name: seed test data
        working-directory: apps/backend
        run: go run ./cmd/seed
      - name: run e2e
        working-directory: apps/web
        run: pnpm exec playwright test
      - name: backend logs on failure
        if: failure()
        run: tail -200 /tmp/backend.log || true
      - name: stop backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: apps/web/playwright-report/
          retention-days: 7

  admin-web-e2e:
    name: Admin Web (Playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - name: install deps
        working-directory: apps/admin
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/admin
        run: pnpm tsc --noEmit -p .
      - name: build
        working-directory: apps/admin
        run: pnpm build
      - name: install Playwright browsers
        working-directory: apps/admin
        run: pnpm exec playwright install --with-deps chromium
      - name: run e2e (admin auth tests auto-skip without admin-backend)
        working-directory: apps/admin
        run: pnpm exec playwright test
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin
          path: apps/admin/playwright-report/
          retention-days: 7
