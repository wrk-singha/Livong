name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, extraphase]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go (backend + admin-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            apps/backend/go.sum
            apps/admin-backend/go.sum
      - name: backend build + test
        working-directory: apps/backend
        run: |
          go build ./...
          go test ./...
      - name: admin-backend build + test
        working-directory: apps/admin-backend
        run: |
          go build ./...
          go test ./...

  web-typecheck-and-build:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/web
        run: pnpm tsc --noEmit -p .
      - name: build
        working-directory: apps/web
        run: pnpm build

  web-e2e:
    name: Web (Playwright e2e)
    runs-on: ubuntu-latest
    needs: web-typecheck-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: run e2e (auth-required tests auto-skip in CI — no backend running)
        working-directory: apps/web
        run: pnpm exec playwright test
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
